<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!--
      The extension's own surface, in the website's identity.

      ── WHY THIS WAS REDRAWN ────────────────────────────────────────────────────────────────────
      It was navy #0f172a with an orange #f97316 accent and no theme support, while bedready.io is
      slate-and-white (or #070a12 in dark) with a violet → cyan → lime spectrum and violet-600 as the
      one action colour. Someone installing from /extension met a different product. The 2026-08-22
      design review found the same split on the site — a defined identity that almost nothing used —
      and this is the last surface still outside it.

      The tokens below are copied from `src/app/globals.css` rather than imported: an extension page
      has no access to the site's stylesheet, so the only options are duplicate-with-a-note or drift.
      If those tokens change, this file is the second place to change them.

      The typeface is deliberately NOT matched. The site sets IBM Plex Sans with
      `ui-sans-serif, system-ui` as its fallback, and bundling ~100KB of woff2 into an extension to
      win one weight is a bad trade — so this uses the site's own fallback stack, which is a match by
      the site's own definition rather than a compromise.
    -->
    <style>
      :root {
        --bg: #ffffff;
        --surface-2: #f1f5f9;
        --line: #e2e8f0;
        --fg: #0f172a;
        --fg-muted: #334155;
        --fg-subtle: #475569;
        --action: #7c3aed;        /* violet-600 — "this is the thing to do" */
        --action-hover: #6d28d9;  /* violet-700 */
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #070a12;
          --surface-2: #1e293b;
          --line: rgba(255, 255, 255, 0.1);
          --fg: #e2e8f0;
          --fg-muted: #cbd5e1;
          --fg-subtle: #94a3b8;
          --action: #8b5cf6;      /* violet-500 — the 600 is too dark on #070a12 */
          --action-hover: #a78bfa;
        }
      }
      body {
        width: 320px; margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
        font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      /* The wordmark's spectrum sweep, in the one place a 320px popup can carry it. */
      .rule { height: 3px; border-radius: 999px; background-image: linear-gradient(100deg, #7c3aed, #06b6d4 55%, #84cc16); }
      h1 { font-size: 15px; margin: 12px 0 4px; color: var(--fg); letter-spacing: -0.01em; }
      p.sub { margin: 0 0 12px; color: var(--fg-subtle); font-size: 12px; }
      label.drop {
        display: block; padding: 18px; text-align: center; border: 2px dashed var(--line);
        border-radius: 8px; cursor: pointer; color: var(--fg-muted); background: var(--surface-2);
        transition: border-color .15s, background .15s, color .15s;
      }
      label.drop:hover { border-color: var(--action); color: var(--fg); }
      label.drop.dragging { border-color: var(--action); background: color-mix(in srgb, var(--action) 10%, var(--surface-2)); color: var(--fg); }
      input[type="file"] { display: none; }
      #status { margin-top: 12px; white-space: pre-wrap; font-size: 12px; color: var(--fg-muted); }
      a { color: var(--action); font-weight: 500; }
      a:hover { color: var(--action-hover); }
      :where(a, label, input):focus-visible { outline: 2px solid var(--action); outline-offset: 2px; border-radius: 4px; }
      @media (prefers-reduced-motion: reduce) { label.drop { transition: none; } }
      :root { color-scheme: light dark; accent-color: var(--action); }
      /* `hidden` loses to any author `display` rule (.field is a grid) — make it win, for every element. */
      [hidden] { display: none !important; }
      /* Settings: which printer, and what happens on a download. Native controls on purpose — a
         <select> and checkboxes keep keyboard, screen-reader and OS behaviour with no script. */
      .field { display: grid; gap: 4px; margin: 0 0 10px; font-size: 12px; color: var(--fg-muted); }
      .field select {
        font: inherit; color: var(--fg); background: var(--surface-2); border: 1px solid var(--line);
        border-radius: 8px; padding: 6px 8px;
      }
      .field select:focus-visible { outline: 2px solid var(--action); outline-offset: 2px; }
      .note { margin: 4px 0 0; font-size: 11px; color: var(--fg-subtle); }
      .toggle { display: flex; gap: 8px; align-items: flex-start; margin: 0 0 6px; font-size: 12px; color: var(--fg-muted); cursor: pointer; }
      .toggle input { margin: 2px 0 0; flex: none; }
      .toggle input:focus-visible { outline: 2px solid var(--action); outline-offset: 2px; }
      details.prefs { margin: 0 0 12px; }
      details.prefs summary { cursor: pointer; font-size: 12px; color: var(--fg-subtle); margin-bottom: 6px; }
      /* The Full Spectrum choice and its button, in the same tokens as everything else. */
      .choice { margin-top: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
      .choice p { margin: 0 0 8px; font-size: 12px; color: var(--fg-muted); }
      .btn {
        margin-top: 10px; width: 100%; padding: 8px; border: 0; border-radius: 8px; background: var(--action);
        color: #fff; font: 600 13px/1.4 inherit; cursor: pointer;
      }
      .btn:hover { background: var(--action-hover); }
      .btn:focus-visible { outline: 2px solid var(--action); outline-offset: 2px; }
      .btn.ghost { background: transparent; color: var(--action); border: 1px solid var(--line); }
      .btn.ghost:hover { background: var(--surface-2); color: var(--action-hover); }
    </style>
  </head>
  <body>
    <div class="rule"></div>
    <h1 id="title">3MF → Snapmaker U1</h1>
    <p class="sub">100% in your browser — nothing is uploaded.</p>
    <label class="field">Convert for
      <select id="target"></select>
    </label>
    <label class="field" id="nozzle-field">Nozzle
      <select id="nozzle"></select>
      <span class="note" id="nozzle-note" hidden></span>
    </label>
    <details class="prefs" id="prefs">
      <summary>On download</summary>
      <label class="toggle"><input type="checkbox" switch id="auto" /> <span>Convert .3mf downloads from MakerWorld, Printables and Thingiverse automatically</span></label>
      <label class="toggle"><input type="checkbox" switch id="keep" /> <span>Keep the original download as well</span></label>
    </details>
    <label class="drop" id="drop">
      Drop a .3mf here, or click to choose
      <input id="file" type="file" accept=".3mf" />
    </label>
    <div id="opts"></div>
    <div id="status"></div>
    <button type="button" class="btn ghost" id="edit" hidden>Edit colours on bedready.io →</button>
    <p class="sub" style="margin-top: 12px">Full preview &amp; color editor at <a id="site" href="https://bedready.io/convert" target="_blank">bedready.io/convert</a></p>
    <script src="dist/popup.js"></script>
  </body>
</html>
